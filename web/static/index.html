<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>AI 朋友</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/marked.min.js"></script>
</head>
<body>
    <div class="chat-header">
        <div class="avatar">星</div>
        <div class="info">
            <h1>小星</h1>
            <div class="status">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">连接中...</span>
                <span class="typing-dots" id="typing-dots" style="display:none">
                    <span></span><span></span><span></span>
                </span>
                <span style="color:#888;margin:0 4px">|</span>
                <span style="color:#a78bfa" id="emotion-text"></span>
            </div>
        </div>
    </div>

    <div class="chat-messages" id="chat-messages">
    </div>

    <div class="chat-input-area">
        <textarea id="input" placeholder="说点什么..." rows="1"></textarea>
        <button id="send-btn" disabled>➤</button>
    </div>

    <script src="/static/app.js?v=2"></script>
</body>
</html>
