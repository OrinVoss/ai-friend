<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 调用监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; padding: 16px; font-size: 13px; }
  h1 { font-size: 16px; margin-bottom: 12px; color: #58a6ff; display: flex; align-items: center; gap: 12px; }
  h1 small { font-size: 12px; color: #8b949e; font-weight: normal; }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .controls button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .controls button:hover { background: #30363d; }
  .controls .count { color: #8b949e; font-size: 12px; }
  .card { border: 1px solid #30363d; border-radius: 6px; margin-bottom: 6px; overflow: hidden; }
  .card-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; user-select: none; background: #161b22; }
  .card-header:hover { background: #1c2128; }
  .card-header .arrow { color: #484f58; transition: transform 0.15s; font-size: 10px; }
  .card-header .arrow.open { transform: rotate(90deg); }
  .card-header .time { color: #8b949e; font-size: 11px; min-width: 60px; }
  .card-header .source { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: #21262d; color: #58a6ff; }
  .card-header .model { font-size: 10px; color: #8b949e; }
  .card-header .duration { font-size: 11px; margin-left: auto; }
  .card-header .meta-info { font-size: 10px; color: #8b949e; text-align: right; }
  .card-body { display: none; padding: 8px 10px; border-top: 1px solid #21262d; background: #0d1117; }
  .card-body.open { display: block; }
  .card-body .msg { margin-bottom: 8px; border: 1px solid #21262d; border-radius: 4px; overflow: hidden; }
  .card-body .msg-header { padding: 3px 8px; font-size: 11px; font-weight: 600; }
  .card-body .msg-header.system { background: #1a2332; color: #58a6ff; }
  .card-body .msg-header.user { background: #1f2a1f; color: #3fb950; }
  .card-body .msg-header.assistant { background: #2a1f2a; color: #d2a8ff; }
  .card-body .msg-content { background: #161b22; padding: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: none; color: #e6edf3; }
  .card-body .resp { background: #161b22; border: 1px solid #21262d; border-radius: 4px; padding: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: none; color: #e6edf3; }
  .card-body .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 11px; margin-bottom: 6px; }
  .card-body .meta dt { color: #8b949e; }
  .card-body .meta dd { color: #e6edf3; }
  .fast { color: #3fb950; }
  .medium { color: #d29922; }
  .slow { color: #f85149; }
  .no-records { text-align: center; padding: 40px; color: #484f58; font-size: 14px; }
  .status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #161b22; border-top: 1px solid #30363d; padding: 4px 16px; font-size: 11px; color: #8b949e; display: flex; gap: 16px; }
  .tab-bar { display: flex; gap: 0; margin-bottom: 12px; }
  .tab-bar button { background: #21262d; border: 1px solid #30363d; border-right: none; color: #8b949e; padding: 6px 16px; cursor: pointer; font-size: 12px; }
  .tab-bar button:first-child { border-radius: 4px 0 0 4px; }
  .tab-bar button:last-child { border-radius: 0 4px 4px 0; border-right: 1px solid #30363d; }
  .tab-bar button.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .placeholder { color: #484f58; font-style: italic; }
</style>
</head>
<body>

<h1>
  🤖 LLM API 调用监控
  <small>完整记录每次发往 LLM 的请求与响应</small>
</h1>

<div class="controls">
  <button onclick="fetchData()">🔄 刷新</button>
  <button id="auto-btn" onclick="toggleAuto()">▶ 自动刷新</button>
  <button onclick="clearData()">🗑 清空</button>
  <span class="count" id="count">0 条记录</span>
</div>

<div id="list"><div class="no-records">等待数据...</div></div>
<div class="status-bar">
  <span id="status">就绪</span>
  <span id="auto-status"></span>
</div>

<script>
let autoRefresh = false;
let refreshTimer = null;

function fmtDuration(ms) {
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function clsDuration(ms) {
  if (ms < 2000) return 'fast';
  if (ms < 6000) return 'medium';
  return 'slow';
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function roleIcon(role) {
  if (role === 'system') return '⚙️';
  if (role === 'user') return '👤';
  if (role === 'assistant') return '🤖';
  return '❓';
}

function formatContent(content) {
  if (!content) return '<span class="placeholder">(空)</span>';
  // Try pretty-print JSON
  if (typeof content === 'string') {
    try {
      const parsed = JSON.parse(content);
      return esc(JSON.stringify(parsed, null, 2));
    } catch(e) {
      return esc(content);
    }
  }
  return esc(JSON.stringify(content, null, 2));
}

function renderCard(rec) {
  const durCls = clsDuration(rec.duration_ms);

  // Build messages display
  let msgsHtml = '';
  if (rec.messages && rec.messages.length > 0) {
    rec.messages.forEach(m => {
      const role = m.role || '?';
      const content = m.content || '';
      msgsHtml += `
        <div class="msg">
          <div class="msg-header ${role}">${roleIcon(role)} ${role}</div>
          <div class="msg-content">${formatContent(content)}</div>
        </div>
      `;
    });
  } else {
    msgsHtml = '<div class="placeholder">(无消息记录)</div>';
  }

  // Build response display
  let respHtml = '';
  if (rec.response) {
    respHtml = formatContent(rec.response);
  } else {
    respHtml = '<span class="placeholder">(空响应)</span>';
  }

  return `
    <div class="card">
      <div class="card-header" onclick="this.nextElementSibling.classList.toggle('open'); this.querySelector('.arrow').classList.toggle('open')">
        <span class="arrow">▶</span>
        <span class="time">${esc(rec.timestamp)}</span>
        <span class="source">${esc(rec.source || '?')}</span>
        <span class="model">${esc(rec.model)}</span>
        <span class="duration ${durCls}">${fmtDuration(rec.duration_ms)}</span>
        <span class="meta-info">${rec.messages?.length || 0} 条消息</span>
      </div>
      <div class="card-body">
        <div class="meta">
          <dt>温度</dt><dd>${rec.temperature}</dd>
          <dt>max_tokens</dt><dd>${rec.max_tokens}</dd>
          <dt>response_format</dt><dd>${rec.response_format ? esc(JSON.stringify(rec.response_format)) : '(无)'}</dd>
        </div>
        <h3 style="font-size:12px;color:#8b949e;margin:6px 0 4px;">📥 请求消息 (${rec.messages?.length || 0} 条)</h3>
        ${msgsHtml}
        <h3 style="font-size:12px;color:#8b949e;margin:8px 0 4px;">📤 响应 (${rec.response?.length || 0} 字符)</h3>
        <div class="resp">${respHtml}</div>
      </div>
    </div>
  `;
}

function fetchData() {
  document.getElementById('status').textContent = '加载中...';
  fetch('/api/monitor?limit=0')
    .then(r => r.json())
    .then(data => {
      const list = document.getElementById('list');
      if (!data || data.length === 0) {
        list.innerHTML = '<div class="no-records">暂无记录</div>';
      } else {
        list.innerHTML = data.map(renderCard).join('');
      }
      document.getElementById('count').textContent = (data?.length || 0) + ' 条记录';
      document.getElementById('status').textContent = '就绪';
    })
    .catch(e => {
      document.getElementById('list').innerHTML = '<div class="no-records">加载失败: ' + e.message + '</div>';
      document.getElementById('status').textContent = '错误: ' + e.message;
    });
}

function clearData() {
  fetch('/api/monitor/clear').then(() => fetchData());
  document.getElementById('status').textContent = '已清空';
}

function toggleAuto() {
  autoRefresh = !autoRefresh;
  const btn = document.getElementById('auto-btn');
  if (autoRefresh) {
    refreshTimer = setInterval(fetchData, 3000);
    document.getElementById('auto-status').textContent = '自动刷新：每 3s';
    if (btn) btn.textContent = '⏹ 停止自动';
  } else {
    clearInterval(refreshTimer);
    refreshTimer = null;
    document.getElementById('auto-status').textContent = '';
    if (btn) btn.textContent = '▶ 自动刷新';
  }
}

// Initial load
fetchData();
</script>
</body>
</html>
