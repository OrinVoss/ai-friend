<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 调用监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', monospace; background: #f6f8fa; color: #1f2328; padding: 16px; padding-bottom: 40px; font-size: 13px; }
  h1 { font-size: 16px; margin-bottom: 12px; color: #0969da; display: flex; align-items: center; gap: 12px; }
  h1 small { font-size: 12px; color: #656d76; font-weight: normal; }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .controls button { background: #ffffff; border: 1px solid #d1d9e0; color: #24292f; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .controls button:hover { background: #f3f4f6; border-color: #b7bec5; }
  .controls .count { color: #656d76; font-size: 12px; }
  .card { border: 1px solid #d1d9e0; border-radius: 6px; margin-bottom: 6px; overflow: hidden; background: #ffffff; box-shadow: 0 1px 2px rgba(31,35,40,0.04); }
  .card-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; user-select: none; background: #ffffff; }
  .card-header:hover { background: #f6f8fa; }
  .card-header .arrow { color: #656d76; transition: transform 0.15s; font-size: 10px; }
  .card-header .arrow.open { transform: rotate(90deg); }
  .card-header .time { color: #656d76; font-size: 11px; min-width: 60px; }
  .card-header .source { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: #ddf4ff; color: #0969da; }
  .card-header .model { font-size: 10px; color: #656d76; }
  .card-header .duration { font-size: 11px; margin-left: auto; }
  .card-header .meta-info { font-size: 10px; color: #656d76; text-align: right; }
  .card-body { display: none; padding: 8px 10px; border-top: 1px solid #e6eaef; background: #ffffff; }
  .card-body.open { display: block; }
  .card-body .msg { margin-bottom: 8px; border: 1px solid #e6eaef; border-radius: 4px; overflow: hidden; }
  .card-body .msg-header { padding: 3px 8px; font-size: 11px; font-weight: 600; }
  .card-body .msg-header.system { background: #ddf4ff; color: #0969da; }
  .card-body .msg-header.user { background: #dafbe1; color: #1a7f37; }
  .card-body .msg-header.assistant { background: #fbefff; color: #7d1ebf; }
  .card-body .msg-content { background: #f6f8fa; padding: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: none; color: #1f2328; }
  .card-body .resp { background: #f6f8fa; border: 1px solid #e6eaef; border-radius: 4px; padding: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: none; color: #1f2328; }
  .card-body .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 11px; margin-bottom: 6px; }
  .card-body .meta dt { color: #656d76; }
  .card-body .meta dd { color: #1f2328; }
  .fast { color: #1a7f37; }
  .medium { color: #9a6700; }
  .slow { color: #cf222e; }
  .no-records { text-align: center; padding: 40px; color: #8c959f; font-size: 14px; }
  .status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #d1d9e0; padding: 4px 16px; font-size: 11px; color: #656d76; display: flex; gap: 16px; }
  .tab-bar { display: flex; gap: 0; margin-bottom: 12px; }
  .tab-bar button { background: #ffffff; border: 1px solid #d1d9e0; border-right: none; color: #656d76; padding: 6px 16px; cursor: pointer; font-size: 12px; }
  .tab-bar button:first-child { border-radius: 4px 0 0 4px; }
  .tab-bar button:last-child { border-radius: 0 4px 4px 0; border-right: 1px solid #d1d9e0; }
  .tab-bar button.active { background: #0969da; color: #fff; border-color: #0969da; }
  .placeholder { color: #8c959f; font-style: italic; }
</style>
</head>
<body>

<h1>
  🤖 LLM API 调用监控
  <small>完整记录每次发往 LLM 的请求与响应</small>
</h1>

<div class="controls">
  <button id="refresh-btn">🔄 刷新</button>
  <button id="auto-btn">▶ 自动刷新</button>
  <button id="clear-btn">🗑 清空</button>
  <button id="export-json-btn">⬇ 导出 JSON</button>
  <button id="export-md-btn">⬇ 导出 Markdown</button>
  <span class="count" id="count">0 条记录</span>
</div>

<div id="list"><div class="no-records">等待数据...</div></div>
<div class="status-bar">
  <span id="status">就绪</span>
  <span id="auto-status"></span>
</div>

<script src="/static/monitor.js"></script>
</body>
</html>
