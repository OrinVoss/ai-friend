<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 调用监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; padding: 16px; font-size: 13px; }
  h1 { font-size: 16px; margin-bottom: 12px; color: #58a6ff; display: flex; align-items: center; gap: 12px; }
  h1 small { font-size: 12px; color: #8b949e; font-weight: normal; }
  .controls { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .controls button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .controls button:hover { background: #30363d; }
  .controls .count { color: #8b949e; font-size: 12px; }
  .card { border: 1px solid #30363d; border-radius: 6px; margin-bottom: 6px; overflow: hidden; }
  .card-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; user-select: none; background: #161b22; }
  .card-header:hover { background: #1c2128; }
  .card-header .arrow { color: #484f58; transition: transform 0.15s; font-size: 10px; }
  .card-header .arrow.open { transform: rotate(90deg); }
  .card-header .time { color: #8b949e; font-size: 11px; min-width: 60px; }
  .card-header .source { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: #21262d; color: #58a6ff; }
  .card-header .model { font-size: 10px; color: #8b949e; }
  .card-header .duration { font-size: 11px; margin-left: auto; }
  .card-header .meta-info { font-size: 10px; color: #8b949e; text-align: right; }
  .card-body { display: none; padding: 8px 10px; border-top: 1px solid #21262d; background: #0d1117; }
  .card-body.open { display: block; }
  .card-body .msg { margin-bottom: 8px; border: 1px solid #21262d; border-radius: 4px; overflow: hidden; }
  .card-body .msg-header { padding: 3px 8px; font-size: 11px; font-weight: 600; }
  .card-body .msg-header.system { background: #1a2332; color: #58a6ff; }
  .card-body .msg-header.user { background: #1f2a1f; color: #3fb950; }
  .card-body .msg-header.assistant { background: #2a1f2a; color: #d2a8ff; }
  .card-body .msg-content { background: #161b22; padding: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: none; color: #e6edf3; }
  .card-body .resp { background: #161b22; border: 1px solid #21262d; border-radius: 4px; padding: 8px; font-size: 11px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: none; color: #e6edf3; }
  .card-body .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 11px; margin-bottom: 6px; }
  .card-body .meta dt { color: #8b949e; }
  .card-body .meta dd { color: #e6edf3; }
  .fast { color: #3fb950; }
  .medium { color: #d29922; }
  .slow { color: #f85149; }
  .no-records { text-align: center; padding: 40px; color: #484f58; font-size: 14px; }
  .status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #161b22; border-top: 1px solid #30363d; padding: 4px 16px; font-size: 11px; color: #8b949e; display: flex; gap: 16px; }
  .tab-bar { display: flex; gap: 0; margin-bottom: 12px; }
  .tab-bar button { background: #21262d; border: 1px solid #30363d; border-right: none; color: #8b949e; padding: 6px 16px; cursor: pointer; font-size: 12px; }
  .tab-bar button:first-child { border-radius: 4px 0 0 4px; }
  .tab-bar button:last-child { border-radius: 0 4px 4px 0; border-right: 1px solid #30363d; }
  .tab-bar button.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  .placeholder { color: #484f58; font-style: italic; }
</style>
</head>
<body>

<h1>
  🤖 LLM API 调用监控
  <small>完整记录每次发往 LLM 的请求与响应</small>
</h1>

<div class="controls">
  <button id="refresh-btn">🔄 刷新</button>
  <button id="auto-btn">▶ 自动刷新</button>
  <button id="clear-btn">🗑 清空</button>
  <span class="count" id="count">0 条记录</span>
</div>

<div id="list"><div class="no-records">等待数据...</div></div>
<div class="status-bar">
  <span id="status">就绪</span>
  <span id="auto-status"></span>
</div>

<script src="/static/monitor.js"></script>
</body>
</html>
